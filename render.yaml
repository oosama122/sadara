services:
  - type: web
    name: sadara-backend
    runtime: python
    plan: free
    # Keep sadara/ and dashbord/ available beside backend/ at runtime.
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && python manage.py seed_site && exec gunicorn sadara_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
